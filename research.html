        .research-intro { color: var(--text-muted); line-height: 1.7; font-size: 0.98rem; margin-bottom: 2.5rem; max-width: 680px; }
        .section-label { font-size: 0.72rem; letter-spacing: 0.13em; text-transform: uppercase; color: var(--accent); margin-bottom: 1.2rem; margin-top: 2.4rem; }
        .paper-card { background: linear-gradient(145deg, #131c26, #111820); border: 1px solid rgba(255,255,255,0.05); border-radius: 16px; padding: 1.6rem 1.8rem; margin-bottom: 1rem; text-decoration: none; color: inherit; display: block; transition: 0.3s ease; position: relative; }
        .paper-card:hover { border-color: rgba(255,189,89,0.45); box-shadow: 0 0 24px rgba(255,189,89,0.1); transform: translateX(4px); }
        .paper-meta { display: flex; align-items: center; gap: 0.8rem; margin-bottom: 0.6rem; flex-wrap: wrap; }
        .paper-year { font-size: 0.75rem; font-weight: 700; color: var(--accent); letter-spacing: 0.06em; }
        .paper-journal { font-size: 0.75rem; color: var(--text-muted); font-style: italic; }
        .paper-tag { font-size: 0.68rem; padding: 0.15rem 0.5rem; border-radius: 999px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
        .tag-fundamental { background: rgba(255,189,89,0.12); color: var(--accent); }
        .tag-bio { background: rgba(100,220,160,0.1); color: #64dc9f; }
        .tag-robot { background: rgba(100,200,255,0.1); color: #64c8ff; }
        .tag-medical { background: rgba(255,150,100,0.1); color: #ff9664; }
        .tag-material { background: rgba(180,100,255,0.1); color: #c87fff; }
        .paper-card h2 { font-size: 1.05rem; font-weight: 600; margin-bottom: 0.5rem; }
        .paper-card p { color: var(--text-muted); font-size: 0.88rem; line-height: 1.6; margin-bottom: 0.7rem; }
        .paper-link-row { display: flex; gap: 0.7rem; flex-wrap: wrap; margin-top: 0.4rem; }
        .paper-link { display: inline-flex; align-items: center; gap: 0.3rem; font-size: 0.78rem; padding: 0.3rem 0.75rem; border-radius: 8px; background: rgba(255,189,89,0.08); color: var(--accent); border: 1px solid rgba(255,189,89,0.2); text-decoration: none; transition: 0.2s; }
        .paper-link:hover { background: rgba(255,189,89,0.18); border-color: var(--accent); }
        .paper-link.alt { background: rgba(255,255,255,0.04); color: var(--text-muted); border-color: rgba(255,255,255,0.1); }
        .paper-link.alt:hover { background: rgba(255,255,255,0.08); color: var(--text-primary); }
    </style>

<script>
document.getElementById("page-content").innerHTML = `
<h1>Research Papers</h1>
<p class="research-intro">
    The science of gecko adhesion spans biology, physics, chemistry, and engineering. These are the key studies
    that built our understanding — from the first force measurements on individual setae, to robots climbing
    glass, to medical adhesives in the operating room.
</p>

<p class="section-label">Foundational Biology &amp; Physics</p>

<div class="paper-card">
    <div class="paper-meta">
        <span class="paper-year">2000</span>
        <span class="paper-journal">Nature</span>
        <span class="paper-tag tag-fundamental">Fundamental</span>
    </div>
    <h2>Autumn et al. — Adhesive Force of a Single Gecko Foot-Hair</h2>
    <p>First direct measurement of the adhesive force of a single seta. Demonstrated that individual setae produce up to 200 µN and that the mechanism is consistent with van der Waals interactions — not suction, glue, or capillary forces.</p>
    <div class="paper-link-row">
        <a class="paper-link" href="https://www.nature.com/articles/35079073" target="_blank">↗ Read on Nature.com</a>
        <a class="paper-link alt" href="https://www.acs.org/education/celebrating-chemistry-editions/2020-ncw/gecko.html" target="_blank">↗ ACS Gecko explainer</a>
    </div>
</div>

<div class="paper-card">
    <div class="paper-meta">
        <span class="paper-year">2002</span>
        <span class="paper-journal">PNAS</span>
        <span class="paper-tag tag-fundamental">Fundamental</span>
    </div>
    <h2>Autumn et al. — Evidence for van der Waals Adhesion in Gecko Setae</h2>
    <p>Conclusive evidence that van der Waals forces are responsible for gecko adhesion. Measured adhesion on both hydrophobic and hydrophilic surfaces, ruling out water-based mechanisms and confirming the purely physical origin of the grip.</p>
    <div class="paper-link-row">
        <a class="paper-link" href="https://www.pnas.org/doi/10.1073/pnas.192252799" target="_blank">↗ Read on PNAS</a>
        <a class="paper-link alt" href="https://www.bbc.com/news/science-environment" target="_blank">↗ BBC Science coverage</a>
    </div>
</div>

<div class="paper-card">
    <div class="paper-meta">
        <span class="paper-year">2006</span>
        <span class="paper-journal">PNAS</span>
        <span class="paper-tag tag-bio">Biology</span>
    </div>
    <h2>Arzt et al. — From Micro to Nano Contacts in Biological Attachment Devices</h2>
    <p>Comparative analysis of adhesion structures across climbing animals — gecko, spider, beetle, fly. Shows a universal scaling law where smaller animals have larger contact elements relative to body size, revealing how evolution has optimized adhesion geometry.</p>
    <div class="paper-link-row">
        <a class="paper-link" href="https://www.pnas.org/doi/10.1073/pnas.192252799" target="_blank">↗ Read on PNAS</a>
        <a class="paper-link alt" href="https://www.sciencedirect.com/topics/materials-science/gecko-adhesion" target="_blank">↗ ScienceDirect: Gecko Adhesion</a>
    </div>
</div>

<p class="section-label">Robotics &amp; Engineering</p>

<div class="paper-card">
    <div class="paper-meta">
        <span class="paper-year">2008</span>
        <span class="paper-journal">Science</span>
        <span class="paper-tag tag-robot">Robotics</span>
    </div>
    <h2>Kim et al. — Whole Body Adhesion: Hierarchical, Directional, and Distributed Control (Stickybot)</h2>
    <p>The foundational Stickybot paper. Describes the design of Stanford's gecko-inspired climbing robot, showing that directional dry adhesion using synthetic elastomer setae can support robotic locomotion on smooth vertical surfaces like glass and acrylic.</p>
    <div class="paper-link-row">
        <a class="paper-link" href="https://www.science.org/doi/10.1126/science.1146885" target="_blank">↗ Read on Science.org</a>
        <a class="paper-link alt" href="https://news.stanford.edu/stories/2006/09/sticky-bot-stanford-engineer-creates-robot-can-climb-walls" target="_blank">↗ Stanford News: Stickybot</a>
        <a class="paper-link alt" href="https://news.mit.edu/2009/stickybot-092509" target="_blank">↗ MIT News coverage</a>
    </div>
</div>

<div class="paper-card">
    <div class="paper-meta">
        <span class="paper-year">2015</span>
        <span class="paper-journal">Journal of the Royal Society Interface</span>
        <span class="paper-tag tag-robot">Robotics</span>
    </div>
    <h2>Hawkes et al. — Human Climbing with Efficiently Scaled Gecko-Inspired Dry Adhesives</h2>
    <p>First demonstration of a 70 kg adult climbing a vertical glass wall using gecko-inspired hand pads. Uses 24 adhesive tiles and directional loading — proving the technology can scale to full human bodyweight, a milestone for wearable adhesion.</p>
    <div class="paper-link-row">
        <a class="paper-link" href="https://royalsocietypublishing.org/doi/10.1098/rsif.2014.1085" target="_blank">↗ Read on Royal Society</a>
        <a class="paper-link alt" href="https://news.stanford.edu/2014/11/19/gecko-gloves-climb-141119/" target="_blank">↗ Stanford News: Human Climbing</a>
    </div>
</div>

<p class="section-label">Medical &amp; Materials</p>

<div class="paper-card">
    <div class="paper-meta">
        <span class="paper-year">2008</span>
        <span class="paper-journal">PNAS</span>
        <span class="paper-tag tag-medical">Medical</span>
    </div>
    <h2>Mahdavi et al. — A Biodegradable and Biocompatible Gecko-Inspired Tissue Adhesive</h2>
    <p>Harvard team introduces the first gecko-inspired biomedical adhesive using PGSA micropillar arrays. Tested on wet tissue — demonstrates strong adhesion, gentle detachment, and biocompatibility, opening the path to suture-free wound closure.</p>
    <div class="paper-link-row">
        <a class="paper-link" href="https://www.pnas.org/doi/10.1073/pnas.0712117105" target="_blank">↗ Read on PNAS</a>
        <a class="paper-link alt" href="https://www.nature.com/search?q=Gecko+Inspired+Bandages&order=relevance" target="_blank">↗ Nature: Gecko Bandage research</a>
        <a class="paper-link alt" href="https://wyss.harvard.edu/" target="_blank">↗ Harvard Wyss Institute</a>
    </div>
</div>

<div class="paper-card">
    <div class="paper-meta">
        <span class="paper-year">2012</span>
        <span class="paper-journal">Advanced Materials</span>
        <span class="paper-tag tag-material">Materials</span>
    </div>
    <h2>Bartlett et al. — Looking Beyond Fibrillar Features to Scale Gecko-Like Adhesion (Geckskin)</h2>
    <p>Introduces Geckskin — a 3×4 inch adhesive patch that holds over 317 kg on a smooth wall and peels off without residue. Replicates the gecko's tendon geometry, not just its setae, proving that whole-structure compliance is as critical as nanoscale fibrils.</p>
    <div class="paper-link-row">
        <a class="paper-link" href="https://onlinelibrary.wiley.com/doi/10.1002/adma.201103704" target="_blank">↗ Read on Wiley</a>
        <a class="paper-link alt" href="https://www.umass.edu/news/article/umass-amherst-researchers-create-geckskin" target="_blank">↗ UMass Amherst: Geckskin</a>
    </div>
</div>

<div class="paper-card">
    <div class="paper-meta">
        <span class="paper-year">2021</span>
        <span class="paper-journal">NASA Technical Reports</span>
        <span class="paper-tag tag-robot">Space</span>
    </div>
    <h2>NASA Gecko Grippers — Tested Aboard the ISS</h2>
    <p>NASA's gecko-inspired robotic grippers tested aboard the International Space Station for satellite servicing. Synthetic setae grippers successfully attach to and release objects in vacuum and microgravity, validating the technology for future on-orbit missions.</p>
    <div class="paper-link-row">
        <a class="paper-link" href="https://www.nasa.gov/missions/station/gecko-grippers-moving-on-up/" target="_blank">↗ NASA Official Page</a>
        <a class="paper-link alt" href="https://www.nasa.gov/astrobee/" target="_blank">↗ NASA Astrobee Program</a>
    </div>
</div>
`;
</script>
