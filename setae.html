<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Setae Model</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<script src="js/layout.js"></script>

<script>
  const pageContent = document.getElementById("page-content");
  const mainContent = document.querySelector(".main-content");

  if (mainContent) {
    mainContent.style.maxWidth = "1200px";
    mainContent.style.paddingTop = "5rem";
  }

  pageContent.innerHTML = `
    <h1>Interactive Gecko Setae Adhesion Model</h1>

    <p style="color: var(--text-muted); line-height: 1.6; margin-bottom: 1rem;">
      This module shows a simplified cluster of gecko setae and spatulae interacting with a rigid surface.
      Drag inside the simulation to tilt and compress the footpad, then observe how contact count and directional
      adhesion change in real time.
    </p>

    <div id="setae-model-container" style="width: 100%; min-height: 700px; border: 1px solid rgba(255,189,89,0.18); border-radius: 16px; background: linear-gradient(145deg, #131c26, #111820); padding: 12px;"></div>
  `;
</script>

<script src="js/setae.js"></script>

</body>
</html>
