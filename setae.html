<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Setae Model</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<script src="js/layout.js"></script>
<script>
  const pageContent = document.getElementById("page-content");
  const mainContent = document.querySelector(".main-content");

  if (mainContent) {
    mainContent.style.maxWidth = "1240px";
    mainContent.style.paddingTop = "5rem";
  }

  pageContent.innerHTML = `
    <h1>Gecko Foot Hierarchical Zoom Model</h1>
    <p style="color: var(--text-muted); line-height: 1.65; margin-bottom: 1.2rem;">
      Start from a gecko foot already pressing against a wall, then zoom in to reveal the
      structural hierarchy: macroscopic footpad, lamella ridges, dense setae, spatula pads,
      and finally atoms interacting via van der Waals forces at the contact interface.
    </p>
    <div
      id="setae-model-container"
      style="
        width: 100%;
        min-height: 740px;
        border: 1px solid rgba(255,189,89,0.18);
        border-radius: 16px;
        background: linear-gradient(145deg,#131c26,#111820);
        padding: 12px;
      "
    >
      <!-- Dedicated visualization container (all content is created inside this div) -->
      <div
        id="gecko-zoom-model"
        style="width: 100%; height: 100%;"
      ></div>
    </div>
  `;
</script>

<!-- New zoom-based visualization (place this script file in js/) -->
<script src="js/gecko-zoom-visualization.js"></script>
</body>
</html>
