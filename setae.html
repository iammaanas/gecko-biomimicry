<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Setae Model</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<script src="js/layout.js"></script>
<script>
  const pageContent = document.getElementById("page-content");
  const mainContent = document.querySelector(".main-content");

  if (mainContent) {
    mainContent.style.maxWidth = "1240px";
    mainContent.style.paddingTop = "5rem";
  }

  pageContent.innerHTML = `
    <h1>Professional Gecko Setae Adhesion Model</h1>
    <p style="color: var(--text-muted); line-height: 1.65; margin-bottom: 1rem;">
      A scientific visualization module for directional dry adhesion. The model simulates a representative
      cluster of setae fibers with nanoscale spatula tips, then computes real-time adhesion from contact area,
      directional alignment, and interface quality.
    </p>
    <div id="setae-model-container" style="width:100%; min-height:740px; border:1px solid rgba(255,189,89,0.18); border-radius:16px; background:linear-gradient(145deg,#131c26,#111820); padding:12px;"></div>
  `;
</script>
<script src="js/setae.js"></script>
</body>
</html>
