<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Gecko Foot Hierarchical Zoom</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<script src="js/layout.js"></script>
<script>
  const pageContent = document.getElementById("page-content");
  const mainContent = document.querySelector(".main-content");

  if (mainContent) {
    mainContent.style.maxWidth = "1240px";
    mainContent.style.paddingTop = "5rem";
  }

  pageContent.innerHTML = `
    <h1>Gecko Foot Hierarchical Zoom</h1>
    <p style="color: var(--text-muted); line-height: 1.65; margin-bottom: 1rem;">
      Start at a gecko foot already sticking to a wall, then zoom smoothly through the full adhesion hierarchy:
      side view of the footpad, lamellar ridges, microscopic setae, nanoscopic spatula pads, and finally atoms
      interacting via van der Waals forces.
    </p>
    <div
      id="setae-model-container"
      style="
        width: 100%;
        min-height: 740px;
        border: 1px solid rgba(255,189,89,0.18);
        border-radius: 16px;
        background: linear-gradient(145deg,#131c26,#111820);
        padding: 12px;
      "
    >
      <div
        id="gecko-zoom-model"
        style="width: 100%; height: 100%; position: relative;"
      ></div>
    </div>
  `;
</script>

<!-- New hierarchical zoom visualization (no global CSS, all inline) -->
<script src="js/gecko-zoom-visualization.js"></script>
</body>
</html>
